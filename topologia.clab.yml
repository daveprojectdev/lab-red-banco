# La red de un banco con sede, centro de datos y dos sucursales, y su salida a
# internet por dos proveedores, en contenedores (Containerlab). Los routers son
# FRRouting; los equipos de prueba, Linux con herramientas de red.
#
#   sede ──── núcleo, costo 10 ──── cpd (centro de datos)
#   cada sucursal (suc1, suc2) tiene dos enlaces:
#     principal → sede, costo 10
#     respaldo  → cpd,  costo 100 (solo se usa si cae el principal)
#   internet:
#     sede → isp1 (proveedor principal)
#     cpd  → isp2 (proveedor de respaldo)
#     isp1 y isp2 → nube, donde vive el servidor «web» de internet y un hacker
#   el socio (procesadora de pagos) → cpd, por línea dedicada, solo al servidor de pagos
#
# El plan de direcciones está en README.md y la explicación, en docs/guia.md.
# Las direcciones de los routers viven en su frr.conf; las de los equipos,
# aquí abajo.
name: banco

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1

  nodes:
    # ── Routers del banco ──
    # A cada router se le quita la ruta por defecto de la red de gestión de
    # Containerlab (eth0): si no, le ganaría a la que aprende por OSPF o BGP y
    # el tráfico «a internet» saldría por donde no es.
    sede:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/sede/frr.conf:/etc/frr/frr.conf
        - configs/sede/acceso.sh:/etc/frr/acceso.sh
      exec:
        # La regla de acceso necesita iptables, que la imagen no trae: se
        # instala mientras todavía hay salida por eth0.
        - apk add --no-cache -q iptables
        - sh /etc/frr/acceso.sh
        - ip route del default
    cpd:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/cpd/frr.conf:/etc/frr/frr.conf
        - configs/cpd/acceso.sh:/etc/frr/acceso.sh
      exec:
        - apk add --no-cache -q iptables
        - sh /etc/frr/acceso.sh
        - ip route del default
    suc1:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/suc1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default
    suc2:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/suc2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default

    # ── Internet: dos proveedores y la «nube» donde vive un servidor web ──
    isp1:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/isp1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default
    isp2:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/isp2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default
    nube:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/nube/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default

    # ── El socio: una procesadora de pagos con línea dedicada al centro de datos ──
    socio:
      kind: linux
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/socio/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default

    # ── Equipos de prueba: uno por red local ──
    # Todo su tráfico va por su router (eth1); eth0 es la gestión de
    # Containerlab y deja de usarse.
    pc-sede:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route replace default via 10.0.1.1
    admin:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.0.99.10/24 dev eth1
        - ip route replace default via 10.0.99.1
    srv:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1
    pc-suc1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1
    pc-suc2:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.1.2.10/24 dev eth1
        - ip route replace default via 10.1.2.1
    web:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 203.0.113.10/24 dev eth1
        - ip route replace default via 203.0.113.1
    # El servidor de pagos del banco: el único al que llega el socio.
    pagos:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route replace default via 10.10.20.1
    # El servidor del socio que se conecta al de pagos.
    pasarela:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 192.168.50.10/24 dev eth1
        - ip route replace default via 192.168.50.1
    # Un atacante en internet. La segunda dirección (10.1.1.99, que parece de
    # la sucursal 1) es su disfraz para el ataque de suplantación.
    hacker:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      exec:
        - ip addr add 198.51.100.66/24 dev eth1
        - ip addr add 10.1.1.99/32 dev eth1
        - ip route replace default via 198.51.100.1

  links:
    # Núcleo
    - endpoints: ["sede:eth1", "cpd:eth1"]
    # Sucursal 1: principal a la sede, respaldo al centro de datos
    - endpoints: ["sede:eth2", "suc1:eth1"]
    - endpoints: ["cpd:eth2", "suc1:eth2"]
    # Sucursal 2: igual
    - endpoints: ["sede:eth3", "suc2:eth1"]
    - endpoints: ["cpd:eth3", "suc2:eth2"]
    # Redes locales
    - endpoints: ["sede:eth4", "pc-sede:eth1"]
    - endpoints: ["sede:eth5", "admin:eth1"]
    - endpoints: ["cpd:eth4", "srv:eth1"]
    - endpoints: ["suc1:eth3", "pc-suc1:eth1"]
    - endpoints: ["suc2:eth3", "pc-suc2:eth1"]
    # Salida a internet
    - endpoints: ["sede:eth6", "isp1:eth1"]
    - endpoints: ["cpd:eth5", "isp2:eth1"]
    - endpoints: ["isp1:eth2", "nube:eth1"]
    - endpoints: ["isp2:eth2", "nube:eth2"]
    - endpoints: ["nube:eth3", "web:eth1"]
    - endpoints: ["nube:eth4", "hacker:eth1"]
    # El socio y el servidor de pagos
    - endpoints: ["cpd:eth6", "socio:eth1"]
    - endpoints: ["socio:eth2", "pasarela:eth1"]
    - endpoints: ["cpd:eth7", "pagos:eth1"]
