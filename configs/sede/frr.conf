! Sede central: núcleo con el centro de datos, enlace principal de las dos
! sucursales, las redes de usuarios y de gestión, y la salida principal a
! internet por isp1.
frr defaults traditional
hostname sede
log stdout informational
ip forwarding
no ipv6 forwarding
!
! El bloque del banco entero, para anunciarlo a los proveedores. Lo que no
! tenga una ruta más específica se descarta aquí en vez de dar vueltas.
ip route 10.0.0.0/8 blackhole
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
!
interface eth1
 description nucleo a cpd
 ip address 10.254.0.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description principal de suc1
 ip address 10.254.0.2/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
 description principal de suc2
 ip address 10.254.0.6/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
 description usuarios de la sede
 ip address 10.0.1.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
interface eth5
 description gestion de la red
 ip address 10.0.99.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
interface eth6
 description isp1, salida principal a internet
 ip address 100.64.1.1/31
!
router ospf
 ospf router-id 10.255.0.1
 ! La ruta por defecto que aprende de isp1 la reparte por OSPF con métrica
 ! 10; el centro de datos reparte la suya con 100. Las sucursales salen por aquí.
 default-information originate metric 10 metric-type 2
!
router bgp 65100
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.0 remote-as 64501
 neighbor 100.64.1.0 description isp1
 neighbor 100.64.1.0 timers 3 9
 neighbor 100.64.1.0 timers connect 5
 neighbor 100.64.1.0 advertisement-interval 0
 neighbor 10.255.0.2 remote-as 65100
 neighbor 10.255.0.2 description cpd por iBGP
 neighbor 10.255.0.2 update-source lo
 !
 address-family ipv4 unicast
  network 10.0.0.0/8
  neighbor 10.255.0.2 next-hop-self
  neighbor 100.64.1.0 route-map SOLO-BANCO out
 exit-address-family
!
! A un proveedor solo se le anuncia el bloque del banco. Sin este filtro, la
! sede le pasaría a isp1 lo que el centro de datos aprende de isp2, y el banco
! haría de tránsito entre los dos proveedores.
ip prefix-list BANCO seq 10 permit 10.0.0.0/8
!
route-map SOLO-BANCO permit 10
 match ip address prefix-list BANCO
!
