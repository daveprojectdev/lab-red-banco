! Sede central: núcleo con el centro de datos, enlace principal de las dos
! sucursales, y las redes de usuarios y de gestión.
frr defaults traditional
hostname sede
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
!
interface eth1
 description nucleo a cpd
 ip address 10.254.0.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description principal de suc1
 ip address 10.254.0.2/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
 description principal de suc2
 ip address 10.254.0.6/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
 description usuarios de la sede
 ip address 10.0.1.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
interface eth5
 description gestion de la red
 ip address 10.0.99.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.1
!
