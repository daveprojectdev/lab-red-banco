! La «nube» (AS 64500): un pedazo de internet con un servidor web, al que se
! llega por cualquiera de los dos proveedores.
frr defaults traditional
hostname nube
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 100.100.0.100/32
!
interface eth1
 description isp1
 ip address 100.64.11.1/31
!
interface eth2
 description isp2
 ip address 100.64.12.1/31
!
interface eth3
 description servidor web
 ip address 203.0.113.1/24
!
router bgp 64500
 bgp router-id 100.100.0.100
 no bgp ebgp-requires-policy
 neighbor 100.64.11.0 remote-as 64501
 neighbor 100.64.11.0 description isp1
 neighbor 100.64.11.0 timers 3 9
 neighbor 100.64.11.0 timers connect 5
 neighbor 100.64.11.0 advertisement-interval 0
 neighbor 100.64.12.0 remote-as 64502
 neighbor 100.64.12.0 description isp2
 neighbor 100.64.12.0 timers 3 9
 neighbor 100.64.12.0 timers connect 5
 neighbor 100.64.12.0 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
 exit-address-family
!
