! Proveedor de respaldo (AS 64502): igual que isp1, conectado al centro de
! datos.
frr defaults traditional
hostname isp2
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 100.100.0.2/32
!
interface eth1
 description banco, cpd
 ip address 100.64.2.0/31
!
interface eth2
 description nube
 ip address 100.64.12.0/31
!
router bgp 64502
 bgp router-id 100.100.0.2
 no bgp ebgp-requires-policy
 neighbor 100.64.2.1 remote-as 65100
 neighbor 100.64.2.1 description banco
 neighbor 100.64.2.1 timers 3 9
 neighbor 100.64.2.1 timers connect 5
 neighbor 100.64.2.1 advertisement-interval 0
 neighbor 100.64.12.1 remote-as 64500
 neighbor 100.64.12.1 description nube
 neighbor 100.64.12.1 timers 3 9
 neighbor 100.64.12.1 timers connect 5
 neighbor 100.64.12.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 100.64.2.1 default-originate
 exit-address-family
!
