! Centro de datos: núcleo con la sede, enlace de respaldo de las dos
! sucursales (costo 100: solo se usa si cae el principal) y los servidores.
frr defaults traditional
hostname cpd
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
!
interface eth1
 description nucleo a sede
 ip address 10.254.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description respaldo de suc1
 ip address 10.254.0.4/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface eth3
 description respaldo de suc2
 ip address 10.254.0.8/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface eth4
 description servidores
 ip address 10.10.10.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.2
!
