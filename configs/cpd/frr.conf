! Centro de datos: núcleo con la sede, enlace de respaldo de las dos
! sucursales (costo 100: solo se usa si cae el principal), los servidores, y
! la salida de respaldo a internet por isp2.
frr defaults traditional
hostname cpd
log stdout informational
ip forwarding
no ipv6 forwarding
!
ip route 10.0.0.0/8 blackhole
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
!
interface eth1
 description nucleo a sede
 ip address 10.254.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description respaldo de suc1
 ip address 10.254.0.4/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface eth3
 description respaldo de suc2
 ip address 10.254.0.8/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface eth4
 description servidores
 ip address 10.10.10.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
interface eth5
 description isp2, salida de respaldo a internet
 ip address 100.64.2.1/31
!
router ospf
 ospf router-id 10.255.0.2
 default-information originate metric 100 metric-type 2
!
router bgp 65100
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 100.64.2.0 remote-as 64502
 neighbor 100.64.2.0 description isp2
 neighbor 100.64.2.0 timers 3 9
 neighbor 100.64.2.0 timers connect 5
 neighbor 100.64.2.0 advertisement-interval 0
 neighbor 10.255.0.1 remote-as 65100
 neighbor 10.255.0.1 description sede por iBGP
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 10.0.0.0/8
  neighbor 10.255.0.1 next-hop-self
  neighbor 100.64.2.0 route-map RESPALDO-ENTRADA in
  neighbor 100.64.2.0 route-map RESPALDO-SALIDA out
 exit-address-family
!
ip prefix-list BANCO seq 10 permit 10.0.0.0/8
!
! Salida: lo que llega de isp2 vale menos (preferencia 50 contra 100 de lo que
! trae la sede), así que el banco sale por isp1 mientras exista.
route-map RESPALDO-ENTRADA permit 10
 set local-preference 50
!
! Entrada: hacia isp2 el camino se alarga tres veces con el propio número de
! AS, para que internet prefiera volver por isp1. Y solo el bloque del banco.
route-map RESPALDO-SALIDA permit 10
 match ip address prefix-list BANCO
 set as-path prepend 65100 65100 65100
!
