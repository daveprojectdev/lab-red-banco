! Proveedor principal (AS 64501): le da al banco la ruta por defecto y lo
! conecta con la nube.
frr defaults traditional
hostname isp1
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 100.100.0.1/32
!
interface eth1
 description banco, sede
 ip address 100.64.1.0/31
!
interface eth2
 description nube
 ip address 100.64.11.0/31
!
router bgp 64501
 bgp router-id 100.100.0.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.1 remote-as 65100
 neighbor 100.64.1.1 description banco
 neighbor 100.64.1.1 timers 3 9
 neighbor 100.64.1.1 timers connect 5
 neighbor 100.64.1.1 advertisement-interval 0
 neighbor 100.64.11.1 remote-as 64500
 neighbor 100.64.11.1 description nube
 neighbor 100.64.11.1 timers 3 9
 neighbor 100.64.11.1 timers connect 5
 neighbor 100.64.11.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 100.64.1.1 default-originate
 exit-address-family
!
