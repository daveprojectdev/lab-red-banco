! Sucursal 2: enlace principal a la sede y de respaldo al centro de datos.
frr defaults traditional
hostname suc2
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.12/32
 ip ospf area 0
!
interface eth1
 description principal a sede
 ip address 10.254.0.7/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description respaldo a cpd
 ip address 10.254.0.9/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
!
interface eth3
 description usuarios de la sucursal
 ip address 10.1.2.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.12
!
