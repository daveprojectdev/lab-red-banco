! El socio (AS 65200): una procesadora de pagos con línea dedicada al centro
! de datos del banco. Su servidor «pasarela» habla con el servidor de pagos.
frr defaults traditional
hostname socio
log stdout informational
ip forwarding
no ipv6 forwarding
!
interface lo
 ip address 172.31.255.1/32
!
interface eth1
 description banco, cpd
 ip address 172.31.0.0/31
!
interface eth2
 description servidor pasarela
 ip address 192.168.50.1/24
!
router bgp 65200
 bgp router-id 172.31.255.1
 no bgp ebgp-requires-policy
 neighbor 172.31.0.1 remote-as 65100
 neighbor 172.31.0.1 description banco
 neighbor 172.31.0.1 timers 3 9
 neighbor 172.31.0.1 timers connect 5
 neighbor 172.31.0.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 192.168.50.0/24
 exit-address-family
!
